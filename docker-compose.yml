services:
  db:
    image: postgres:16
    container_name: uptime-db
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime_dev_pw
      POSTGRES_DB: uptime_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: uptime-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: