services:
  db:
    image: postgres:16
    container_name: uptime-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uptime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptime_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-uptime_monitor}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    container_name: uptime-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uptime-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-uptime}:${POSTGRES_PASSWORD:-uptime_dev_pw}@db:5432/${POSTGRES_DB:-uptime_monitor}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-change-in-production}
      CHECK_TIMEOUT_MS: ${CHECK_TIMEOUT_MS:-10000}
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uptime-worker
    command: ["node", "dist/worker/worker.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-uptime}:${POSTGRES_PASSWORD:-uptime_dev_pw}@db:5432/${POSTGRES_DB:-uptime_monitor}
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      CHECK_TIMEOUT_MS: ${CHECK_TIMEOUT_MS:-10000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - db
      - redis

volumes:
  pgdata: