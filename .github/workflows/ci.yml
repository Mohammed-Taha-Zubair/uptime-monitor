name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uptime
          POSTGRES_PASSWORD: uptime_dev_pw
          POSTGRES_DB: uptime_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize Database Schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=uptime_dev_pw psql -h localhost -U uptime -d uptime_monitor -f schema.sql

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Backend Typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Backend Tests
        run: npm test
        working-directory: backend
        env:
          DATABASE_URL: postgres://uptime:uptime_dev_pw@localhost:5432/uptime_monitor
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-12345
          CHECK_TIMEOUT_MS: 10000

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend Build
        run: npm run build
        working-directory: frontend

      - name: Docker Build Backend
        run: docker build -t uptime-backend:ci backend/
